<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes | BIOSALUD</title>
  <link rel="icon" href="/img/logo-icono.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <header class="navbar">
    <a href="/" class="navbar-marca">
      <img src="/img/logo-icono.png" alt="Logo BIOSALUD">
      <span><b>BIO</b>SALUD</span>
    </a>
    <nav class="navbar-links">
      <a href="/">Inicio</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/pacientes" class="activo">Pacientes</a>
      <a href="/medicos">Médicos</a>
      <a href="/citas">Citas</a>
    </nav>
  </header>

  <main class="contenedor">

    <!-- Mensajes de éxito o error -->
    <div id="mensaje" class="alerta oculto"></div>

    <!-- ============ ENCABEZADO ============ -->
    <div class="pagina-titulo con-boton">
      <div>
        <h1>Pacientes</h1>
        <p>Registro y gestión de pacientes</p>
      </div>
      <button class="btn btn-secundario" id="btn-nuevo">+ Nuevo paciente</button>
    </div>

    <!-- ============ BÚSQUEDA Y TABLA ============ -->
    <div class="panel">
      <input type="search" id="buscador" class="buscador"
             placeholder="🔍 Buscar por nombre, apellido, documento o EPS...">

      <div class="tabla-contenedor">
        <table class="tabla">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Documento</th>
              <th>Teléfono</th>
              <th>Correo</th>
              <th>EPS</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-pacientes">
            <tr><td colspan="9" class="vacio">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ============ FORMULARIO (ventana emergente) ============ -->
  <!-- Se usa el mismo formulario para registrar y para editar -->
  <dialog id="modal" class="modal">
    <form id="formulario" novalidate>
      <h2 id="titulo-formulario">Nuevo paciente</h2>
      <input type="hidden" name="id">

      <div class="campos">
        <label>Nombre *
          <input type="text" name="nombre" placeholder="Ej: Carlos">
          <small class="error" data-error="nombre"></small>
        </label>

        <label>Apellido *
          <input type="text" name="apellido" placeholder="Ej: Ramírez">
          <small class="error" data-error="apellido"></small>
        </label>

        <label>Documento *
          <input type="text" name="documento" placeholder="Solo números">
          <small class="error" data-error="documento"></small>
        </label>

        <label>Teléfono *
          <input type="text" name="telefono" placeholder="Ej: 3104567890">
          <small class="error" data-error="telefono"></small>
        </label>

        <label>Correo *
          <input type="email" name="correo" placeholder="nombre@correo.com">
          <small class="error" data-error="correo"></small>
        </label>

        <label>EPS *
          <select name="eps">
            <option value="">-- Seleccione --</option>
            <option>Sura</option>
            <option>Sanitas</option>
            <option>Nueva EPS</option>
            <option>Compensar</option>
            <option>Salud Total</option>
            <option>Famisanar</option>
            <option>Coosalud</option>
            <option>Otra</option>
          </select>
          <small class="error" data-error="eps"></small>
        </label>

        <label>Estado
          <select name="estado">
            <option>Activo</option>
            <option>Inactivo</option>
          </select>
        </label>
      </div>

      <div class="modal-botones">
        <button type="button" class="btn btn-gris" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- ============ PIE DE PÁGINA ============ -->
  <footer class="footer">
    <p><b>BIOSALUD</b> · Vida, salud y tecnología</p>
    <p>© 2026 · Proyecto académico</p>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/pacientes.js"></script>
</body>
</html>
